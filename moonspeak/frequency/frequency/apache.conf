# Must set serverName before including anything
Define serverName frequency

# apache ifdefine hack: https://serverfault.com/questions/1022233/using-ifdefine-with-environment-variables
Define "MOONSPEAK_PLATFORM_${MOONSPEAK_PLATFORM}"
Define "MOONSPEAK_DISABLE_AUTH_${MOONSPEAK_DISABLE_AUTH}"

<IfDefine MOONSPEAK_PLATFORM_mac>
# config used when running without docker (brew install apache2)
Include ${PWD}/../../apache_mac.conf
Listen 8001
</IfDefine>

<IfDefine MOONSPEAK_PLATFORM_docker>
Include /opt/moonspeak/apache_docker.conf
</IfDefine>


DocumentRoot "../static/"
<Directory "../static/">
    Require all granted
</Directory>

WSGIScriptAlias "/api/" "apache.wsgi/api/"
<Files "./apache.wsgi">
    Require all granted
</Files>


# "set the number of threads to 0 you will enable a special mode intended for using a daemon process to run a managed set of processes"
# see: https://modwsgi.readthedocs.io/en/master/configuration-directives/WSGIDaemonProcess.html
# force the imported worker script to use this special process group
WSGIDaemonProcess worker threads=0 display-name=%{GROUP}
WSGIImportScript ./runworkers.py process-group=worker application-group=%{GLOBAL}
