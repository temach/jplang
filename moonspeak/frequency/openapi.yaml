openapi: 3.0.1
info:
  title: File and Text submission API ChatGPT generated
  version: 1.0.0
paths:

  '/submit':
    post:
      summary: Submit a file or text for processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usertext:
                  type: string
                  description: Text to be processed
              required:
                - usertext
          multipart/form-data:
            schema:
              type: object
              properties:
                binaryfile:
                  type: string
                  format: binary
                  description: Binary file to be processed
              required:
                - binaryfile

      responses:

        '202':
          description: Task successfully created, you can start polling to get result
          links:
            # see: https://swagger.io/docs/specification/links/
            GetTaskResult:
              operationId: getTaskResultById
              parameters:
                id: '$response.body#/id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - pending
                      - processing
                required:
                  - id
                  - status

        '400':
          description: Bad request, possibly due to file size being too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  frequency:
                    type: object
                    additionalProperties:
                      type: integer
                  input_type:
                    type: string
                  error:
                    type: string
                required:
                  - frequency
                  - input_type
                  - error


  '/result/{id}':
    get:
      summary: Get the current status/result of a task by task ID
      operationId: getTaskResultById
      parameters:
        - name: id
          schema:
            type: string
            format: uuid
          in: path
          required: true
          description: UUID of the task, e.g. d129c05a-9b0c-47fd-93cd-c07c3a918611

      responses:

        '200':
          description: Task is finished, the result is in the browser
          content:
            application/json:
              schema:
                type: object
                properties:
                  frequency:
                    type: object
                    additionalProperties:
                      type: integer
                  input_type:
                    type: string
                  error:
                    type: string
                required:
                  - frequency
                  - input_type
                  - error

        '202':
          description: Task is still processing, please poll again
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - pending
                      - processing
                required:
                  - id
                  - status

        '404':
          description: Task uuid not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - notfound
                required:
                  - id
                  - status
