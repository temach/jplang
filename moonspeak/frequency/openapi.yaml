openapi: 3.0.1
info:
  title: File and Text Submission API chatGPT generated
  version: 1.0.0
paths:
  /submit:
    post:
      summary: Submit a file or text for processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usertext:
                  type: string
                  description: Text to be processed
              required:
                - usertext
          multipart/form-data:
            schema:
              type: object
              properties:
                binaryfile:
                  type: string
                  format: binary
                  description: Binary file to be processed
      responses:
        '200':
          description: Task successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  frequency:
                    type: object
                    additionalProperties:
                      type: integer
                  input_type:
                    type: string
                  error:
                    type: string
        '400':
          description: Bad request, possibly due to file size being too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  frequency:
                    type: object
                    additionalProperties:
                      type: integer
                  input_type:
                    type: string
                  error:
                    type: string

  /result/{id}:
    get:
      summary: Get the current status/result of a task by task ID
      parameters:
        - name: id
          schema:
            type: string
            format: uuid
          in: path
          required: true
          description: UUID of the task, e.g. d129c05a-9b0c-47fd-93cd-c07c3a918611
      responses:
        '200':
          description: Task result retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      frequency:
                        type: object
                        additionalProperties:
                          type: integer
                      input_type:
                        type: string
                      error:
                        type: string
                  - type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message indicating that the task was not found
