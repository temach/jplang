error_log /dev/stderr error;

events {
  worker_connections  1024;
}

http {
    access_log /dev/stdout combined;

    # when running on docker-compose:
    # see: https://stackoverflow.com/questions/57937222/502-bad-gateway-nginx-no-resolver-defined-to-resolve
    # re-validate DNS names frequently, use docker-compose resolver else nginx does round-robin
    resolver 127.0.0.11 valid=2s;

    # speed hack: we know the insides of landing service and want
    # to avoid two 307 redirects, so force add the language parameter now
    # language check order:
    map "$cookie_lang#$http_accept_language#$host" $lang {
        # 0 - what language cookie you have (allow special "localhost" lang)
        "~*^en" "en";
        "~*^ru" "ru";
        "~*^localhost" "localhost";

        # 1 - what does accept_language header have
        "~*#en" "en";
        "~*#ru" "ru";

        # 2 - what domain are you targetting, useful for tools that normally dont supply accept_language header
        "~*ru$" "ru";
        "~*localhost$" "localhost";

        # finally use english by default
        default "en";
    }

    # create a variable to hold the name of target service that this request wants to access
    map "$request_uri" $instance {
        "~*^/router/route/([^/]+)" $1;
    }

    # determine if nginx is going in circles, because some *.selfhosted.moonsepak.org resolved to itself
    map "$http_x_real_ip" $block_if_real_ip {
        default 0;
        ~.+ 1;  # This regular expression matches any non-empty value
    }

    #====================================
    # info sec
    # mozilla guidelines: https://infosec.mozilla.org/guidelines/web_security.html
    # check headers: https://securityheaders.com/

    # rate limiting: 3 requests per second i.e. 180 requests per minute
    limit_req_zone $binary_remote_addr zone=spin_up_user_containers:10m rate=180r/m;

    # hide exact nginx version
    server_tokens off;

    # enforce HTTPS but not forever, to allow localhost testing
    # proxy_hide_header "Strict-Transport-Security";
    # add_header "Strict-Transport-Security" "max-age=31536 ; includeSubDomains";

    # do not want to leak capability URLs (unique strings) via Referrer header
    # see: https://developer.mozilla.org/en-US/docs/Web/Security/Referer_header:_privacy_and_security_concerns
    proxy_hide_header "Referrer-Policy";
    add_header "Referrer-Policy" "origin";

    # prevent browsers from guessing mime type
    proxy_hide_header "X-Content-Type-Options";
    add_header "X-Content-Type-Options" "nosniff";

    # configure log format for storing CSP violation reports, see CSP config details below
    log_format reportcsp escape=none "CSP violation report: $request_body";

    # nginx will compress data on the fly as its going out
    # see: https://docs.nginx.com/nginx/admin-guide/web-server/compression/
    gzip on;
    gzip_types text/plain text/xml text/css application/javascript;
    gzip_min_length 1000;

    # configuration parameters for opentelemetry tracing
    include    ./opentelemetry_module.conf;

    # use value of HOST header including the port to always redirect back to correct microservice
    server_name_in_redirect off;
    port_in_redirect on;

    #====================================
    # basically a slightly smarter HTTPS proxy
    server {
        server_name *.moonspeak.org;
        listen      0.0.0.0:80 default_server;

        # SSL start
        # when running in docker-compose in production you must bind mount certificates
        listen      0.0.0.0:443 ssl http2 default_server;
        ssl_certificate fullchain.pem;
        ssl_certificate_key privkey.pem;
        # SSL end

        # First check if x-real-ip is already in request, that means we are going around in circles
        # 99% becasue docker-compose network DNS did not override *.selfhosted.mooonspeak.org because container is down
        if ($block_if_real_ip = 1) {
            return 503 "Error: The requested service '$host' resolved to gateway's 127.0.0.1. It is not recognised by 'gateway' as a valid upstream service. Either it never existed or is shutdown currently.";
        }

        # Second check if need to redirect HTTP to HTTPS
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }

        # otherwise mod apache oidc cookies are too large (about 4000 bytes) and can not pass through nginx
        proxy_busy_buffers_size 16k;
        proxy_buffers   8 16k;
        proxy_buffer_size   8k;

        # Content-Security-Policy
        # see: https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html
        # csp with nginx: https://chrisguitarguy.com/2019/07/05/working-with-multiple-content-security-policy-headers/
        # csp browser may not send report immediately: https://stackoverflow.com/questions/60632559/how-to-add-report-to-content-security-policy-directly-in-web-config
        # "frame-ancestors" is used instead of "X-Frame-Options" header
        set $CSP "report-uri https://gateway.selfhosted.moonspeak.org/reportcsp";
        set $CSP "${CSP}; default-src 'self'";
        set $CSP "${CSP}; base-uri 'self'";
        set $CSP "${CSP}; object-src 'none'";
        set $CSP "${CSP}; img-src 'self' data:";
        set $CSP "${CSP}; style-src 'self' 'unsafe-inline'";
        set $CSP "${CSP}; script-src 'self' 'unsafe-inline'";
        set $CSP "${CSP}; font-src 'self'";
        set $CSP "${CSP}; form-action 'self'";
        set $CSP "${CSP}; connect-src 'self'";
        set $CSP "${CSP}; frame-ancestors *.selfhosted.moonspeak.org";
        set $CSP "${CSP}; frame-src *.selfhosted.moonspeak.org";
        # add_header "Content-Security-Policy-Report-Only" $CSP always;
        add_header "Content-Security-Policy" $CSP;

        # see: https://csplite.com/csp181/#header_Report-To
        # see: https://docs.report-uri.com/setup/reporting-api/
        # add_header "Report-To" '{"group":"csp-endpoint","endpoints":[{"url":"/reportcsp"}],"include_subdomains":true,"max_age":31536000}"';

        #=============================
        # any other routes are routed by their hostname to the specific container
        # because gateway is on the docker-compose network, the hostname resolves to actual container
        location / {
            # set this header to taint the request so we can recognise if nginx is querying itself
            # due to *.selfhosted.moonspeak.org resolving to 127.0.0.1 instead of service IP
            # can also rely on presence of "traceparent" header from opentelemetry_module
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://$host;
 
            # cache redirects and make sure they are https
            proxy_intercept_errors on;
            error_page 307 = @handle_redirect;
        }

        location @handle_redirect {
            set $new_uri $upstream_http_location;
            # include "moonspeak.org here, because moonspeak pages might redirect to 
            # some totally external http site, so dont enforce https on that
            if ($new_uri ~* "^http://(.*)moonspeak.org(.*)") {
                set $new_uri https://$1moonspeak.org$2;
            }
            return 307 $new_uri;
        }
    }

    #====================================
    # a list of shortcuts for local development
    server {
        server_name selfhosted.moonspeak.org gateway.selfhosted.moonspeak.org 127.0.0.1;
        listen      0.0.0.0:80;

        # SSL start
        # when running in docker-compose in production you must bind mount certificates
        listen      0.0.0.0:443 ssl http2;
        ssl_certificate fullchain.pem;
        ssl_certificate_key privkey.pem;
        # SSL end

        #==============================
        # store CSP violation reports
        location /reportcsp {
            # nginx does not read body of request unless its used somewhere, so must do a dummy proxy_pass to itself
            # see: https://stackoverflow.com/questions/4939382/logging-post-data-from-request-body
            access_log /dev/stdout reportcsp;
            proxy_pass $scheme://127.0.0.1/reportcsp/dummy;
        }
        location /reportcsp/dummy {
            access_log off;
            # all is good, and no content is returned (for return status 200 chromium shows net::ERR_BLOCKED_BY_ORB)
            return 204;
        }

        #==============================
        # Useful hardcoded urls
        location = / {
            return 307 https://landing.selfhosted.moonspeak.org;
        }

        location /demo {
            # get the exact url string from docker-compose and graph microservice README.txt
            return 307 "https://u-demouser1-s-graph.selfhosted.moonspeak.org/?lang=i18n";
        }

        location /logs {
            return 307 https://grafana.selfhosted.moonspeak.org:3000/explore;
        }

        location /trace {
            return 307 https://jaeger.selfhosted.moonspeak.org:16686;
        }

        location /email {
            # to view OTP email from keycloak in WebUI
            return 307 https://mailhog.selfhosted.moonspeak.org:8025;
        }

        location /keycloak {
            return 307 https://keycloak.selfhosted.moonspeak.org:8443;
        }

        #=============================
        # any other routes are 404 and ignored
        location / {
            return 404;
        }
    }
}
